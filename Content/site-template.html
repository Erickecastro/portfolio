<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/app.css" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="{{URL}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Portfólio | Ericke Castro" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{URL}}" />
    <meta property="og:image" content="{{SITE_URL}}/portfolio-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ericke Castro — Desenvolvedor de Software Android, Kotlin e desenvolvimento mobile" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="{{SITE_URL}}/portfolio-preview.png" />
    <meta name="twitter:image:alt" content="Ericke Castro — Desenvolvedor de Software Android, Kotlin e desenvolvimento mobile" />
    <script type="application/ld+json" id="structured-data">{{STRUCTURED_DATA}}</script>
</head>
<body>
    <div id="app">{{PAGE_CONTENT}}</div>
    <script src="/js/metadata.js"></script>
    <script src="/_framework/blazor.webassembly.js"></script>
</body>
</html>
